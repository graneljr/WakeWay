
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1 | tr -d "'\"")
          release_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$release_version" ]; then
            echo "Tag $GITHUB_REF_NAME must match pubspec.yaml version $package_version."
            exit 1
          fi

      - name: Prepare Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Set ANDROID_KEYSTORE_BASE64 in the repository Actions secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wakeway-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/wakeway-release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Set ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in the repository Actions secrets."
            exit 1
          fi
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${{ secrets.GOOGLE_SERVER_CLIENT_ID }}" \
            --dart-define=WAKEWAY_GITHUB_REPOSITORY="${{ github.repository }}"

      - name: Prepare release APK asset
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/WakeWay-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WakeWay
          path: build/app/outputs/flutter-apk/WakeWay-android.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/app/outputs/flutter-apk/WakeWay-android.apk \
            --title "WakeWay $GITHUB_REF_NAME" \
            --generate-notes
